name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev
      - name: Ruff format
        run: uv run ruff format --check src tests main.py
      - name: Ruff lint
        run: uv run ruff check src tests main.py
      - name: Mypy
        run: uv run mypy src/settings src/schemas src/api src/utils/generator.py src/utils/output_guard.py

  tests:
    name: Tests (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --group dev
      - name: Smoke import
        run: uv run python -c "import main; assert main.app.title"
        env:
          APP_ENV: test
      - run: uv run pytest -m ${{ matrix.kind }} --cov=src --cov-report=term-missing
        env:
          APP_ENV: test

  security:
    name: Secrets and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
          enable-cache: true
      - run: uv sync --group dev
      - name: Detect secrets in tracked files
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --exclude-files '^(uv\.lock)$'
      - name: Gitleaks history scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source=/repo --redact --no-banner
      - name: Reject large tracked files
        run: |
          oversized=$(git ls-files -z | xargs -0 -r du -k | awk '$1 > 1024 {print}')
          test -z "$oversized" || { echo "$oversized"; exit 1; }

  docker:
    name: Docker build and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: rag-kb-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
