x-rag-environment: &rag-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-moscow_kb}
  QDRANT_TIMEOUT: ${QDRANT_TIMEOUT:-30}
  ES_URL: http://elasticsearch:9200
  ES_INDEX: ${ES_INDEX:-kb_chunks}
  TOP_K: ${TOP_K:-5}
  DENSE_CANDIDATES_K: ${DENSE_CANDIDATES_K:-50}
  SPARSE_CANDIDATES_K: ${SPARSE_CANDIDATES_K:-50}
  RRF_K: ${RRF_K:-60}
  USE_RERANKER: ${USE_RERANKER:-true}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
  RERANKER_CANDIDATES_K: ${RERANKER_CANDIDATES_K:-50}
  MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-14000}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://customer-llm:8000/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-customer-model}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-180}

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rag-api:
    build:
      context: .
      target: runtime
    image: rag-kb-service:local
    environment:
      <<: *rag-environment
      API_SECRET: ${API_SECRET:-}
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  indexer:
    build:
      context: .
      target: runtime
    image: rag-kb-service:local
    profiles: ["indexing"]
    environment:
      <<: *rag-environment
    command: ["python", "scripts/build_index.py"]
    volumes:
      - ./data/chunks_json:/app/data/chunks_json:ro
      - ./logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  es-search-api:
    image: rag-kb-service:local
    pull_policy: never
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ES_URL: http://elasticsearch:9200
      ES_INDEX: ${ES_INDEX:-kb_chunks}
      CHUNKS_DIR: /app/data/chunks_json
    command: ["uvicorn", "src.integrations.elastic.api:app", "--host", "0.0.0.0", "--port", "8010"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${ES_API_PORT:-8010}:8010"
    volumes:
      - ./data/chunks_json:/app/data/chunks_json:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/es/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  gradio-ui:
    image: rag-kb-service:local
    pull_policy: never
    environment:
      <<: *rag-environment
      GRADIO_HOST: 0.0.0.0
      GRADIO_PORT: 7860
      ES_SEARCH_API_URL: http://es-search-api:8010
    command: ["python", "-m", "src.integrations.gradio.app"]
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    volumes:
      - ./logs:/app/logs
    depends_on:
      rag-api:
        condition: service_healthy
      es-search-api:
        condition: service_healthy
    restart: unless-stopped

  telegram-bot:
    image: rag-kb-service:local
    pull_policy: never
    profiles: ["telegram"]
    environment:
      <<: *rag-environment
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    command: ["python", "-m", "src.integrations.telegram.bot"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.9.6
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant-data:
  es-data:
  ollama-data:
